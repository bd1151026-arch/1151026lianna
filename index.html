<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李連娜 | 個人簡介 Portfolio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sunburst: {
                            50: '#fffbe6',
                            100: '#fff3b3',
                            400: '#ffca3a',
                            500: '#ffb703',
                            600: '#fb8500',
                        },
                        vibrant: {
                            rose: '#ff4d6d',
                            violet: '#7209b7',
                            blue: '#4895ef',
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', '"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .photo-glow {
            box-shadow: 0 20px 50px -10px rgba(251, 133, 0, 0.3), 0 0 30px 0 rgba(255, 202, 58, 0.2);
        }
        .toast {
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
    </style>
</head>
<body class="bg-amber-50/40 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between selection:bg-sunburst-400 selection:text-slate-900">

    <!-- Toast Notification -->
    <div id="toast" class="toast fixed top-6 right-6 transform -translate-y-20 opacity-0 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 z-50 pointer-events-none border border-slate-700">
        <i class="fa-solid fa-circle-check text-sunburst-400 text-lg"></i>
        <span id="toast-message" class="text-sm font-semibold">已複製到剪貼簿！</span>
    </div>

    <!-- Main Vibrant Wrapper -->
    <main class="max-w-3xl mx-auto px-6 py-12 md:py-16 w-full flex-grow flex flex-col justify-center">

        <!-- Top Bright Badge -->
        <div class="text-center mb-8">
            <span class="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full bg-white border border-sunburst-200 text-sunburst-600 text-xs font-bold shadow-sm">
                <span class="w-2 h-2 rounded-full bg-sunburst-500 animate-ping"></span>
                <span>黎明技術學院 ‧ 數位多媒體系</span>
            </span>
        </div>

        <!-- Main Hero Card -->
        <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-8 md:p-12 shadow-xl border border-amber-100 relative overflow-hidden text-center">
            
            <!-- Background Decorative Glows -->
            <div class="absolute -top-16 -left-16 w-48 h-48 bg-sunburst-100 rounded-full blur-3xl opacity-70 pointer-events-none"></div>
            <div class="absolute -bottom-16 -right-16 w-56 h-56 bg-orange-100 rounded-full blur-3xl opacity-60 pointer-events-none"></div>

            <!-- Profile Photo Placeholder -->
            <div class="relative w-36 h-36 md:w-44 md:h-44 mx-auto mb-8">
                <!-- Outer Gradient Ring -->
                <div class="absolute -inset-1.5 bg-gradient-to-tr from-sunburst-400 via-sunburst-600 to-vibrant-rose rounded-full blur opacity-75 animate-pulse"></div>
                
                <!-- Inner Photo Container -->
                <div class="relative w-full h-full rounded-full bg-gradient-to-b from-amber-50 to-orange-50 border-4 border-white flex flex-col items-center justify-center photo-glow overflow-hidden group cursor-pointer">
                    <!-- Photo Icon / Placeholder Content -->
                    <div class="w-12 h-12 rounded-full bg-sunburst-100 text-sunburst-600 flex items-center justify-center text-xl mb-1 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-600">個人照片</span>
                    <span class="text-[10px] text-slate-400">Photo Here</span>
                </div>
            </div>

            <!-- Name & Quote -->
            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight mb-3">
                李連娜 <span class="text-xs font-bold text-sunburst-600 bg-sunburst-50 px-2.5 py-1 rounded-lg border border-sunburst-200">Lian-Na</span>
            </h1>

            <p class="text-slate-600 text-base md:text-lg font-medium max-w-lg mx-auto mb-8 leading-relaxed">
                「喜歡簡單生活，也喜歡認真對待每一件事。」
            </p>

            <!-- Compact Tag Grid (Skills & Interests) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-left mb-8">
                
                <!-- Skills -->
                <div class="bg-amber-50/50 p-4 rounded-2xl border border-sunburst-100">
                    <div class="text-xs font-bold uppercase tracking-wider text-sunburst-600 mb-2 flex items-center space-x-1.5">
                        <i class="fa-solid fa-bolt"></i>
                        <span>專業技能</span>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <span class="px-3 py-1 bg-white text-slate-800 text-xs font-bold rounded-xl shadow-sm border border-slate-100">💻 寫代碼</span>
                        <span class="px-3 py-1 bg-white text-slate-800 text-xs font-bold rounded-xl shadow-sm border border-slate-100">📐 微積分</span>
                    </div>
                </div>

                <!-- Interests -->
                <div class="bg-orange-50/40 p-4 rounded-2xl border border-orange-100">
                    <div class="text-xs font-bold uppercase tracking-wider text-sunburst-600 mb-2 flex items-center space-x-1.5">
                        <i class="fa-solid fa-heart"></i>
                        <span>生活興趣</span>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <span class="px-3 py-1 bg-white text-slate-800 text-xs font-bold rounded-xl shadow-sm border border-slate-100">🎵 聽音樂</span>
                        <span class="px-3 py-1 bg-white text-slate-800 text-xs font-bold rounded-xl shadow-sm border border-slate-100">🏃 運動</span>
                        <span class="px-3 py-1 bg-white text-slate-800 text-xs font-bold rounded-xl shadow-sm border border-slate-100">📚 看書</span>
                    </div>
                </div>

            </div>

            <!-- Bright Action Buttons (Contact Links) -->
            <div class="flex flex-wrap justify-center gap-3">
                <button onclick="copyToClipboard('bd1151026@venus.lit.edu.tw', 'Email')" class="flex-1 min-w-[130px] px-4 py-3 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs shadow-md transition-all flex items-center justify-center space-x-2">
                    <i class="fa-regular fa-envelope text-sunburst-400 text-sm"></i>
                    <span>Email</span>
                </button>

                <button onclick="copyToClipboard('neymarhhh115', 'Line ID')" class="flex-1 min-w-[130px] px-4 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-semibold text-xs shadow-md shadow-emerald-500/20 transition-all flex items-center justify-center space-x-2">
                    <i class="fa-brands fa-line text-sm"></i>
                    <span>Line ID</span>
                </button>

                <a href="https://instagram.com/nonayyyyyy_." target="_blank" rel="noopener noreferrer" class="flex-1 min-w-[130px] px-4 py-3 rounded-2xl bg-gradient-to-r from-sunburst-500 to-vibrant-rose hover:opacity-95 text-white font-semibold text-xs shadow-md shadow-orange-500/20 transition-all flex items-center justify-center space-x-2">
                    <i class="fa-brands fa-instagram text-sm"></i>
                    <span>Instagram</span>
                </a>
            </div>

        </div>

    </main>

    <!-- Simple Footer -->
    <footer class="py-6 text-center text-xs text-slate-400 font-medium">
        © <span id="year"></span> 李連娜 Lian-Na. All rights reserved.
    </footer>

    <!-- Copy & Toast Logic -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        function copyToClipboard(text, label) {
            var tempInput = document.createElement("input");
            tempInput.style.position = "absolute";
            tempInput.style.left = "-9999px";
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            showToast(label + ' 已複製到剪貼簿！');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            
            toastMessage.textContent = message;
            toast.classList.remove('-translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-20', 'opacity-0');
            }, 2000);
        }
    </script>
</body>
</html>
